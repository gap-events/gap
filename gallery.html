<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gallery · gặp</title>
<meta name="description" content="Photos from every gặp dinner, party and private event in Saigon. Bridging the gap between strangers through shared experiences.">
<meta property="og:title" content="The gặp gallery">
<meta property="og:description" content="Photos from every gặp dinner, party and private event in Saigon.">
<meta property="og:image" content="https://gapevents.vn/images/hero-1000.jpg">
<meta property="og:url" content="https://gapevents.vn/gallery">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/images/logo-espresso.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap">
<style>
:root{--espresso:#3A1F14;--cream:#F8EEE7;--terracotta:#C1592F;--lacquer:#8C2A1E;--ochre:#C08A2E;--bg:var(--cream);--fg:var(--espresso);--muted:#6B5045;--line:#E4D3C7;--raise:#FFF8F3;--label:var(--lacquer);--ph:#EADBD0}
@media (prefers-color-scheme:dark){:root{--bg:#2B170F;--fg:var(--cream);--muted:#CDB8AA;--line:#4D3226;--raise:var(--espresso);--label:var(--ochre);--ph:#3B2419;color-scheme:dark}.logo-dark{display:none}.logo-light{display:block!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:17px;line-height:1.6}
a{color:inherit}p{margin:0}button{font:inherit;color:inherit}
h1,h2{font-family:Poppins,"Be Vietnam Pro",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,6.5vw,58px)}h2{font-size:clamp(28px,4.6vw,40px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
header .wrap{padding-block:18px;display:flex;justify-content:space-between;align-items:center}
.logo{width:96px;height:auto;display:block}.logo-light{display:none}
header a.back{font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}
.label{font-weight:600;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
.say{color:var(--muted);font-size:18px;max-width:60ch}
.intro{display:grid;gap:12px;padding-block:20px 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-weight:700;font-size:15.5px;background:var(--fg);color:var(--bg);border-radius:999px;padding:12px 22px;text-decoration:none}

/* albums */
.albums{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));padding-bottom:64px}
.album{display:grid;gap:12px;text-decoration:none}
.album .pic{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--ph)}
.album img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.album:hover img{transform:scale(1.03)}
.album:focus-visible{outline:3px solid var(--terracotta);outline-offset:4px;border-radius:18px}
.album .count{position:absolute;right:12px;bottom:12px;background:rgba(20,10,6,.66);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px}
.album h3{font-family:Poppins,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.2}
.album .meta{color:var(--muted);font-size:15px}

/* one album */
.ahead{display:grid;gap:8px;padding-block:8px 24px}
.ahead .crumb{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:var(--muted);justify-self:start}
.ahead .crumb:hover{color:var(--fg)}
.grid{columns:3 280px;column-gap:12px;padding-bottom:40px}
.grid button{display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--ph);cursor:zoom-in;break-inside:avoid}
.grid img{display:block;width:100%;height:auto}
.grid button:focus-visible{outline:3px solid var(--terracotta);outline-offset:2px}
.next-album{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-block:24px 64px}
.next-album a{font-weight:700;text-decoration:none}
.next-album a span{display:block;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}

.empty{padding:40px 0 80px;display:grid;gap:14px;justify-items:start}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(12,6,4,.95);display:grid;grid-template-rows:auto 1fr auto;color:#fff}
.lb[hidden]{display:none}
.lb-top,.lb-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.lb-top span{font-size:14px;color:#d8c8bf}
.lb figure{margin:0;display:grid;place-items:center;min-height:0;padding:0 8px;touch-action:pan-y}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none}
.lb .ic{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:22px;line-height:1;display:grid;place-items:center}
.lb .ic:hover{background:rgba(255,255,255,.16)}
.lb-cap{font-size:14px;color:#d8c8bf;text-align:center;flex:1}

footer{border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}
footer .wrap{padding-block:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.social{display:flex;gap:6px;align-items:center}.social a{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--fg)}.social a:hover{background:var(--raise)}
</style>
</head><body>
<header><div class="wrap"><a href="/" aria-label="gặp home"><img class="logo logo-dark" src="/images/logo-espresso.png" alt="gặp" width="96" height="47"><img class="logo logo-light" src="/images/logo-white.png" alt="gặp" width="96" height="47"></a><a class="back" href="/">Visit gapevents.vn →</a></div></header>

<main class="wrap" id="app" aria-live="polite">
  <section class="intro">
    <p class="label">Gallery</p>
    <h1>The nights we don't forget.</h1>
    <p class="say">Long tables, big nights and private celebrations. Every gặp, one album at a time.</p>
  </section>
  <div class="albums" id="albums"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-top"><span id="lbCount"></span><button class="ic" id="lbClose" type="button" aria-label="Close">×</button></div>
  <figure><img id="lbImg" alt=""></figure>
  <div class="lb-bot"><button class="ic" id="lbPrev" type="button" aria-label="Previous photo">←</button><span class="lb-cap" id="lbCap"></span><button class="ic" id="lbNext" type="button" aria-label="Next photo">→</button></div>
</div>

<footer><div class="wrap"><span>© 2026 gặp</span><span class="social"><a href="https://www.instagram.com/gap.vietnam/" target="_blank" rel="noopener" aria-label="gặp on Instagram" title="Instagram"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a><a href="mailto:hello@gapevents.vn" aria-label="Email hello@gapevents.vn" title="hello@gapevents.vn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></a></span></div></footer>

<script>
(function () {
  // Photos are published by the "Publish gallery" menu in the registrations Sheet (apps-script/Code.gs).
  var DATA = '/images/events/albums.json';
  // Netlify resizes on the fly, so phones get small files. Off Netlify (local preview) use the file as is.
  var CDN = /gapevents\.vn$|netlify\.app$/.test(location.hostname);
  function img(src, w) { return CDN ? '/.netlify/images?url=' + encodeURIComponent(src) + '&w=' + w + '&q=72' : src; }
  function srcset(src, ws) { return CDN ? ws.map(function (w) { return img(src, w) + ' ' + w + 'w'; }).join(', ') : ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var app = document.getElementById('app'), albums = [], current = null;
  var home = app.innerHTML;

  fetch(DATA, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { albums = (d && d.albums) || []; route(); })
    .catch(function () { albums = []; route(); });
  window.addEventListener('hashchange', route);

  function route() {
    var slug = decodeURIComponent(location.hash.replace(/^#/, ''));
    var a = albums.filter(function (x) { return x.slug === slug; })[0];
    if (a) showAlbum(a); else showAlbums();
  }

  function showAlbums() {
    current = null; document.title = 'Gallery · gặp';
    app.innerHTML = home;
    var box = document.getElementById('albums');
    if (!albums.length) {
      box.outerHTML = '<div class="empty"><p class="say">Photos are on their way. In the meantime, catch us on Instagram.</p><a class="btn" href="https://www.instagram.com/gap.vietnam/" target="_blank" rel="noopener">@gap.vietnam →</a></div>';
      return;
    }
    box.innerHTML = albums.map(function (a, i) {
      return '<a class="album" href="#' + encodeURIComponent(a.slug) + '">' +
        '<div class="pic"><img src="' + img(a.cover, 640) + '" srcset="' + srcset(a.cover, [400, 640, 960]) + '" sizes="(max-width:700px) 100vw, 33vw" alt="' + esc(a.title) + '" ' + (i > 2 ? 'loading="lazy" ' : '') + 'decoding="async"><span class="count">' + a.photos.length + ' photos</span></div>' +
        '<div><h3>' + esc(a.title) + '</h3><p class="meta">' + esc([a.date, a.venue].filter(Boolean).join(' · ')) + '</p></div></a>';
    }).join('');
    if (window.__gscroll) { window.scrollTo(0, window.__gscroll); window.__gscroll = 0; }
  }

  function showAlbum(a) {
    current = a; window.__gscroll = window.__gscroll || window.scrollY;
    document.title = a.title + ' · gặp gallery';
    var i = albums.indexOf(a), next = albums[i + 1], prev = albums[i - 1];
    app.innerHTML =
      '<section class="ahead"><button class="crumb" type="button" id="back">← All events</button>' +
      '<h2>' + esc(a.title) + '</h2><p class="say">' + esc([a.date, a.venue].filter(Boolean).join(' · ')) + ' · ' + a.photos.length + ' photos</p></section>' +
      '<div class="grid">' + a.photos.map(function (p, n) {
        return '<button type="button" data-n="' + n + '" aria-label="Open photo ' + (n + 1) + ' of ' + a.photos.length + '">' +
          '<img src="' + img(p.src, 480) + '" srcset="' + srcset(p.src, [360, 480, 720]) + '" sizes="(max-width:620px) 100vw, (max-width:960px) 50vw, 33vw" width="' + p.w + '" height="' + p.h + '" alt="" ' + (n > 5 ? 'loading="lazy" ' : '') + 'decoding="async"></button>';
      }).join('') + '</div>' +
      '<nav class="next-album">' + (prev ? '<a href="#' + encodeURIComponent(prev.slug) + '"><span>Newer</span>← ' + esc(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a href="#' + encodeURIComponent(next.slug) + '" style="text-align:right"><span>Older</span>' + esc(next.title) + ' →</a>' : '') + '</nav>';
    window.scrollTo(0, 0);
    document.getElementById('back').onclick = function () { location.hash = ''; };
    app.querySelector('.grid').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (b) open(+b.dataset.n); });
  }

  // ---------- lightbox ----------
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), at = 0, lastFocus = null;
  function full(p) { return img(p.src, Math.min(1600, Math.ceil(window.innerWidth * (window.devicePixelRatio || 1) / 100) * 100)); }
  function show(n) {
    var ps = current.photos; at = (n + ps.length) % ps.length;
    lbImg.src = full(ps[at]); lbImg.alt = current.title + ', photo ' + (at + 1);
    document.getElementById('lbCount').textContent = (at + 1) + ' / ' + ps.length;
    document.getElementById('lbCap').textContent = current.title;
    [at + 1, at - 1].forEach(function (k) { var p = ps[(k + ps.length) % ps.length]; if (p) new Image().src = full(p); });
  }
  function open(n) { lastFocus = document.activeElement; lb.hidden = false; document.body.style.overflow = 'hidden'; show(n); document.getElementById('lbClose').focus(); }
  function close() { lb.hidden = true; document.body.style.overflow = ''; lbImg.removeAttribute('src'); if (lastFocus) lastFocus.focus(); }
  document.getElementById('lbClose').onclick = close;
  document.getElementById('lbPrev').onclick = function () { show(at - 1); };
  document.getElementById('lbNext').onclick = function () { show(at + 1); };
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target.tagName === 'FIGURE') close(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') show(at + 1); else if (e.key === 'ArrowLeft') show(at - 1);
  });
  var x0 = null;
  lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1)); x0 = null; });
})();
</script>
</body></html>
